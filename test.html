<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Làm bài thi | Ngọc's IELTS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; background: #f4f7f9; }
        .header { position: fixed; top: 0; width: 100%; height: 50px; background: #1a73e8; color: white; display: flex; align-items: center; padding: 0 20px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 1000; }
        .passage { width: 50%; padding: 30px; overflow-y: auto; background: white; border-right: 2px solid #e0e0e0; margin-top: 50px; line-height: 1.6; }
        .questions { width: 50%; padding: 30px; overflow-y: auto; background: #f9f9f9; margin-top: 50px; }
        .q-item { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ddd; }
        input[type="text"] { border: 1px solid #ccc; border-radius: 4px; padding: 5px 10px; width: 200px; margin-left: 10px; }
        h1 { color: #1a73e8; font-size: 24px; }
    </style>
</head>
<body>
    <div class="header" id="test-title">Đang tải đề thi...</div>
    <div class="passage" id="p-content"></div>
    <div class="questions" id="q-content"></div>

    <script>
        const SUPABASE_URL = "https://ykrzqmfijxmzcfvmqqvc.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_pDcY-tGuJbDulH0whCb3hg_6-egn0Bm";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const testId = new URLSearchParams(window.location.search).get('id');

        async function loadData() {
            try {
                const { data, error } = await supabaseClient
                    .from('reading_tests')
                    .select('data')
                    .eq('test_id', testId)
                    .single();

                if (error) throw error;
                
                // LƯU Ý: Đoạn này phải truy cập đúng vào [0] vì dữ liệu là mảng
                const d = data.data; 
                const firstPassage = d.passages[0];

                document.getElementById('test-title').innerText = d.metadata.test_name;
                
                // Hiển thị bài đọc
                document.getElementById('p-content').innerHTML = `
                    <h1>${firstPassage.title}</h1>
                    <div class="content">${firstPassage.content}</div>
                `;
                
                // Hiển thị câu hỏi
                let qHtml = "<h3>Questions</h3>";
                firstPassage.questions.forEach(q => {
                    qHtml += `
                        <div class="q-item">
                            <b>${q.number}.</b> ${q.text} 
                            <input type="text" placeholder="Your answer...">
                        </div>
                    `;
                });
                document.getElementById('q-content').innerHTML = qHtml;

            } catch (err) {
                console.error(err);
                document.getElementById('test-title').innerText = "Lỗi nạp đề thi!";
            }
        }

        if (testId) loadData();
    </script>
</body>
</html>
